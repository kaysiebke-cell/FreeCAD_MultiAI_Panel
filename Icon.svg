<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Transparenter Hintergrund: passt sich hellem wie dunklem Theme an.
       Farben so gewählt, dass sie auf beiden Untergründen lesbar bleiben. -->

  <!-- Code-Klammern < > : der Editor, umschließen den Würfel -->
  <polyline points="44,32 20,64 44,96" fill="none"
            stroke="#3B82F6" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="84,32 108,64 84,96" fill="none"
            stroke="#3B82F6" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- FreeCAD-Würfel: die erzeugte 3D-Geometrie -->
  <polygon points="64,42 80,52 64,62 48,52" fill="#FDBA74"/>
  <polygon points="48,52 64,62 64,86 48,76" fill="#F97316"/>
  <polygon points="80,52 64,62 64,86 80,76" fill="#C2410C"/>

  <!-- KI-Funke -->
  <polygon points="108,14 111,24 121,27 111,30 108,40 105,30 95,27 105,24"
           fill="#FBBF24"/>
</svg>
